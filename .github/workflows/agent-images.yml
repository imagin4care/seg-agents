# Build the image of one base agent (base/) and push it to the GitHub
# Container Registry, as ghcr.io/<owner>/seg-agent-<agent>:<commit>.
#
# Run by hand only ("Run workflow", choosing the agent). It deploys nothing and
# changes no server. What it leaves:
#   - the image, in this repository's packages. A new package may be private:
#     a base agent's must be public for RunPod to pull it (Package settings →
#     Change visibility, once per package; GitHub cannot make it private
#     again). Container storage and transfer on GHCR are free (GitHub's
#     billing page, read 2026-10-03).
#   - its manifest with the image pinned to the digest just pushed, as the
#     artifact "manifest-<agent>": the file a site registers the agent with
#     (base/README.md, "Telling a server about them").
name: Agent images

on:
  workflow_dispatch:
    inputs:
      agent:
        description: The base agent to build
        type: choice
        options: [monai-wholebody-ct, totalsegmentator-ct, totalsegmentator-mr, slip, nv-reason-ct]
      slip_image:
        description: "For slip only: the server image it builds on (ghcr.io/imagin4care/slip-server:<commit>)"
        required: false
        default: ''

permissions:
  contents: read
  packages: write

# One build of an agent at a time; builds of different agents run side by side.
concurrency:
  group: agent-images-${{ inputs.agent }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # NV-Reason-CT's image (some 18 GB, its checkpoint downloaded, split and
    # pushed) takes longer than the others.
    timeout-minutes: 150
    steps:
      # A GPU image is some 10 GB while it is built, SLIP's base more: the
      # runner's preinstalled toolchains that no step here uses make room.
      # NV-Reason-CT's build holds its 10.6 GB checkpoint twice beside torch,
      # then the image's layers and their compressed copies: some 50 GB at its
      # peak, more than the system disk has free. Docker's data then moves to
      # the runner's second disk (/mnt) when that has more room; the builder
      # (setup-buildx's docker-container driver) keeps its layers and cache in
      # a volume under that data root, so they move with it. The runner's own
      # settings in daemon.json are kept.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          room() { df --output=avail "$1" 2>/dev/null | tail -n 1 || echo 0; }
          if (( $(room /mnt) > $(room /) )); then
            sudo systemctl stop docker.socket docker.service
            [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
            sudo jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json > /tmp/daemon.json
            sudo mv /tmp/daemon.json /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          df -h / /mnt
          docker info --format 'Docker keeps its data in {{.DockerRootDir}}'

      - uses: actions/checkout@v7

      # Which Dockerfile, with which build arguments, and the image's name. A
      # tag names the commit it was built from; what is registered is the digest.
      - name: What to build
        id: plan
        env:
          AGENT: ${{ inputs.agent }}
          SLIP_IMAGE: ${{ inputs.slip_image }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seg-agent-$AGENT"
          image="$repository:${GITHUB_SHA::12}"
          case "$AGENT" in
            monai-wholebody-ct)  file=base/monai/Dockerfile;            args=("IMAGE=$image") ;;
            totalsegmentator-ct) file=base/totalsegmentator/Dockerfile; args=(TASK=total WEIGHTS=total_fast "IMAGE=$image") ;;
            totalsegmentator-mr) file=base/totalsegmentator/Dockerfile; args=(TASK=total_mr WEIGHTS=total_fast_mr "IMAGE=$image") ;;
            slip)
              if ! printf '%s' "$SLIP_IMAGE" | grep -Eq '^ghcr\.io/[a-z0-9._/-]+(:[A-Za-z0-9_.-]+|@sha256:[0-9a-f]{64})$'; then
                echo "::error::For slip, give the server image it builds on (ghcr.io/imagin4care/slip-server:<commit>)."
                exit 1
              fi
              file=base/slip/Dockerfile; args=("SLIP_IMAGE=$SLIP_IMAGE") ;;
            # Its manifest is a file of its sources, as SLIP's: nothing to tell the build.
            nv-reason-ct)        file=base/nv-reason-ct/Dockerfile;     args=() ;;
            *) echo "::error::No such base agent: $AGENT"; exit 1 ;;
          esac
          {
            echo "repository=$repository"
            echo "image=$image"
            echo "file=$file"
            # One build argument a line: what build-push-action takes.
            echo "args<<END"
            if [ ${#args[@]} -gt 0 ]; then printf '%s\n' "${args[@]}"; fi
            echo "END"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.plan.outputs.file }}
          build-args: ${{ steps.plan.outputs.args }}
          tags: ${{ steps.plan.outputs.image }}
          push: true

      # The manifest the image serves: the stage `manifest` of its Dockerfile,
      # from the builder's cache (made while the image was built, or
      # NV-Reason-CT's file of its sources), or kept beside SLIP's sources.
      - name: Take its manifest out
        env:
          AGENT: ${{ inputs.agent }}
          FILE: ${{ steps.plan.outputs.file }}
          ARGS: ${{ steps.plan.outputs.args }}
        run: |
          mkdir -p out
          if [ "$AGENT" = slip ]; then
            cp base/slip/manifest.json out/manifest.json
          else
            build_args=()
            while IFS= read -r arg; do [ -z "$arg" ] || build_args+=(--build-arg "$arg"); done <<< "$ARGS"
            docker buildx build . -f "$FILE" --target manifest "${build_args[@]}" --output type=local,dest=out
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pin it to the digest
        env:
          AGENT: ${{ inputs.agent }}
          REPOSITORY: ${{ steps.plan.outputs.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: node base/pin-manifest.mjs out/manifest.json "$REPOSITORY" "$DIGEST" > "out/$AGENT.json"

      - uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ inputs.agent }}
          path: out/${{ inputs.agent }}.json

      - name: Say what was made
        env:
          AGENT: ${{ inputs.agent }}
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## $AGENT"
            echo "Pushed \`$IMAGE\`, digest \`$DIGEST\`."
            echo
            echo "1. If this is the package's first image and it is private: make it public (its Package settings → Change visibility)."
            echo "2. To offer the agent on a site: register the artifact \`manifest-$AGENT\` there (base/README.md)."
            echo
            echo '```json'
            cat "out/$AGENT.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
