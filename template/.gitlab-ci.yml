# Builds the image of the agent and pushes it to this project's own registry,
# under the version its manifest says. Run it from Build › Pipelines ("Run
# pipeline"), or push a tag: v1.0.0.
build:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' manifest.json | head -n 1)
      image="$CI_REGISTRY_IMAGE:$version"
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      docker build -t "$image" .
      docker push "$image"
      echo "The image of version $version is $image"
      echo "Paste it as the image of the agent, with version $version, on the platform (AI agents > New agent)."
      echo "A project's registry is private unless the project is public: for a private one, connect $CI_REGISTRY"
      echo "on the platform first (AI agents > Private images), with a deploy token that has read_registry."
